<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial Menu Editor Harness</title>
<style>
  :root {
    --primary-text-color:#212121; --secondary-text-color:#727272; --card-background-color:#fff; --divider-color:#ddd; --page:#f2efe9;
    --primary-color:#03a9f4; --accent-color:#ff9800; --amber-color:#ffc107; --red-color:#f44336;
    --green-color:#4caf50; --indigo-color:#3f51b5; --teal-color:#009688; --purple-color:#9c27b0; --grey-color:#9e9e9e;
  }
  :root[data-theme="dark"] { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --card-background-color:#1c1c1c; --divider-color:#333; --page:#111; }
  body { margin:0; padding:24px 16px; background:var(--page); color:var(--primary-text-color); font-family:Roboto, system-ui, sans-serif; }
  .wrap { display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:24px; max-width:900px; margin:0 auto; }
  .panel { background:var(--card-background-color); border-radius:16px; padding:16px; }
  .preview { display:flex; align-items:center; justify-content:center; min-height:120px; }
  pre { font-size:12px; white-space:pre-wrap; margin:16px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel"><radial-menu-card-editor id="editor"></radial-menu-card-editor></div>
  <div>
    <div class="preview"><radial-menu-card id="card"></radial-menu-card></div>
    <pre id="out"></pre>
  </div>
</div>
<script type="module">
  import "./ha-stubs.js";
  await import("../dist/ha-dashboard.js");
  await customElements.whenDefined("radial-menu-card");
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "dark") document.documentElement.dataset.theme = "dark";

  const states = {
    "light.kitchen": { entity_id: "light.kitchen", state: "on", attributes: {} },
    "switch.fan": { entity_id: "switch.fan", state: "off", attributes: { icon: "mdi:fan" } },
  };
  const hass = { states, callService: () => {} };
  const Card = customElements.get("radial-menu-card");
  const editor = document.getElementById("editor");
  const card = document.getElementById("card");
  const out = document.getElementById("out");

  const show = (config) => {
    try {
      card.setConfig(config);
      card.hass = hass;
    } catch (err) {
      out.textContent = String(err);
      return;
    }
    out.textContent = JSON.stringify(config, null, 2);
  };
  const config = { type: "custom:radial-menu-card", ...Card.getStubConfig() };
  if (q.get("position")) config.position = q.get("position");
  editor.hass = hass;
  editor.setConfig(config);
  show(config);
  editor.addEventListener("config-changed", (ev) => {
    show(ev.detail.config);
    editor.setConfig(ev.detail.config); // what HA does: echo the config back
  });
</script>
</body>
</html>
